name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install pinned cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.2 --locked
      - name: Report line coverage
        run: cargo llvm-cov --all-targets --locked
