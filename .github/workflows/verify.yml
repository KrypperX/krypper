name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-platforms:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            run_catalog: true
          - os: macos-latest
            run_catalog: false
          - os: windows-latest
            run_catalog: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          components: rustfmt, clippy
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-verify-stable-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust targets
        run: cargo check --all-targets --locked
      - name: Lint Rust targets with Clippy
        if: runner.os != 'Windows'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build Rust targets
        if: runner.os != 'Windows'
        run: cargo build --all-targets --locked
      - name: Test Rust targets
        if: runner.os != 'Windows'
        run: cargo test --all-targets --locked
      - name: Test Rust documentation examples
        if: runner.os != 'Windows'
        run: cargo test --doc --locked
      - name: Verify pinned model catalog input
        if: matrix.run_catalog
        run: |
          gzip -dc snapshots/models-dev/upstream-api.json.gz > "$RUNNER_TEMP/models-dev-api.json"
          cargo run --locked --example generate_model_catalog -- --check-upstream "$RUNNER_TEMP/models-dev-api.json"
      - name: Check offline model catalog
        if: matrix.run_catalog
        run: cargo run --locked --example generate_model_catalog -- --check
      - name: Test offline model-routing evaluation helpers
        if: matrix.run_catalog
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check patch whitespace
        run: git show --check --format=oneline HEAD
  verify:
    if: always()
    needs: verify-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all platform checks to pass
        run: test "${{ needs.verify-platforms.result }}" = "success"
