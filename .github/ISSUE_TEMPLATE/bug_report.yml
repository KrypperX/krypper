name: Bug report
description: Report a reproducible problem in Krypper.
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Share only information you are allowed to publish. Remove tokens, credentials, private prompts, and private workspace contents from examples and logs.
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: State the affected command or capability and the user-visible result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Krypper version or commit
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest safe input and relevant command options.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include relevant errors or test names after removing private data and secrets.
    validations:
      required: false
