[package]
name = "krypper"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
ignore = "0.4.34"
libc = "0.2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }
