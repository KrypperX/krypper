[package]
name = "krypper"
version = "0.1.0"
edition = "2021"
default-run = "krypper"
rust-version = "1.89"
description = "Local-first CLI and agent task runtime with bounded workspace operations"
repository = "https://github.com/KrypperX/krypper"
readme = "README.md"
authors = ["Bom Thatchakorn", "KrypperX"]
license = "Apache-2.0"
publish = false

[workspace]
members = ["crates/krypper-sandbox"]
resolver = "2"

[dependencies]
krypper-sandbox = { version = "0.1.0", path = "crates/krypper-sandbox" }
ignore = "0.4.34"
libc = "0.2"
ring = "0.17"
rpassword = "7.5.5"
base64 = "0.22"
fs2 = "0.4"
signal-hook = { version = "0.4.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
keyring-core = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.3", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
proc-macro2 = "1.0"
syn = { version = "3.0.9", features = ["full", "visit"] }
tempfile = "3.27"
