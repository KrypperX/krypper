[package]
name = "krypper"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Local-first CLI and agent task runtime with bounded workspace operations"
repository = "https://github.com/KrypperX/krypper"
readme = "README.md"
authors = ["Bom Thatchakorn", "KrypperX"]
license = "Apache-2.0"

[dependencies]
ignore = "0.4.34"
libc = "0.2"
ring = "0.17"
rpassword = "7.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }
